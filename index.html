<title>កត់ចំណងដៃ — កម្មវិធីកត់ត្រា និងរបាយការណ៍</title>
<meta name="description" content="កម្មវិធីកត់ចំណងដៃ៖ កត់ត្រាភ្ញៀវ រៀល/ដុល្លារ របាយការណ៍តាមទីកន្លែង Export Excel/PDF បញ្ចូលទិន្នន័យរួម គ្រប់គ្រង Database ដំឡើងបានលើ Desktop និងទូរស័ព្ទ (PWA)។">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="កត់ចំណងដៃ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>/* ================= កម្មវិធីកត់ចំណងដៃ — Design System ================= */
:root{
  --accent:#6366f1; --accent-strong:color-mix(in srgb, var(--accent) 82%, #000);
  --accent-soft:color-mix(in srgb, var(--accent) 14%, #fff);
  --accent-contrast:#ffffff;
  --bg:#f3f4f8; --card:#ffffff; --text:#17203a; --muted:#667089;
  --border:#e3e6ef; --ok:#16a34a; --warn:#d97706; --danger:#dc2626;
  --shadow:0 1px 2px rgba(23,32,58,.06),0 8px 24px -12px rgba(23,32,58,.18);
  --radius:14px;
}
html[data-theme="dark"]{
  --bg:#0d1220; --card:#161d31; --text:#e6e9f4; --muted:#94a0bd;
  --border:#273052; --accent-soft:color-mix(in srgb, var(--accent) 26%, #161d31);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px -14px rgba(0,0,0,.7);
  --ok:#4ade80; --warn:#fbbf24; --danger:#f87171;
}
*{box-sizing:border-box}
html{font-size:16px}
html[data-fs="sm"]{font-size:14px} html[data-fs="lg"]{font-size:18.5px}
html,body{margin:0;padding:0}
body{
  font-family:"Nokora","Khmer OS Battambang","Battambang","Noto Sans Khmer","Leelawadee UI",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.55; -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.side{
  width:248px;flex:0 0 auto;background:var(--card);border-right:1px solid var(--border);
  display:flex;flex-direction:column;gap:4px;padding:18px 12px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.brand .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-strong));
  display:grid;place-items:center;flex:0 0 auto;box-shadow:var(--shadow)}
.brand h1{font-size:1.02rem;margin:0;font-weight:700}
.brand small{color:var(--muted);font-size:.72rem}
.nav-btn{
  display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border:0;border-radius:11px;
  background:transparent;color:var(--muted);font-size:.95rem;cursor:pointer;text-align:left;font-weight:600;
}
.nav-btn svg{flex:0 0 auto}
.nav-btn:hover{background:color-mix(in srgb,var(--text) 5%,transparent);color:var(--text)}
.nav-btn.on{background:var(--accent);color:var(--accent-contrast);box-shadow:var(--shadow)}
.nav-btn.on svg{stroke:#fff}
.side-foot{margin-top:auto;padding:10px 8px;color:var(--muted);font-size:.72rem;border-top:1px dashed var(--border)}
.main{flex:1;min-width:0;padding:22px 26px 90px;max-width:1280px;margin:0 auto;width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.topbar h2{margin:0;font-size:1.3rem}
.topbar .sub{color:var(--muted);font-size:.85rem}

/* ---------- cards / stats ---------- */
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
.stat{display:flex;gap:13px;align-items:center}
.stat .ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;flex:0 0 auto}
.stat .ic svg{stroke:var(--accent-strong)}
.stat .k{color:var(--muted);font-size:.78rem;margin:0}
.stat .v{font-size:1.16rem;font-weight:800;margin:0;letter-spacing:.2px;white-space:nowrap}
.stat .v small{font-weight:600;color:var(--muted);font-size:.72rem}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:1rem}
.card-h .hint{color:var(--muted);font-size:.78rem}

/* ---------- buttons & inputs ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border);
  background:var(--card);color:var(--text);padding:9px 15px;border-radius:11px;cursor:pointer;font-size:.9rem;font-weight:700;
  transition:filter .15s, transform .05s;
}
.btn:hover{filter:brightness(.96)} html[data-theme="dark"] .btn:hover{filter:brightness(1.2)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);border-color:transparent;color:var(--accent-contrast)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--border))}
.btn.danger-fill{background:var(--danger);border-color:transparent;color:#fff}
.btn.sm{padding:5px 10px;font-size:.8rem;border-radius:9px}
.btn.icon{padding:7px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.78rem;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],input[type=tel],select,textarea{
  border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:9px 11px;
  font-size:.92rem;font-family:inherit;outline:none;width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search{position:relative;flex:1;min-width:200px;max-width:420px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);stroke:var(--muted)}
.search input{padding-left:36px}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.row select{min-width:128px;flex:0 1 auto}
.row.wrap{flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:6px 13px;font-size:.8rem;cursor:pointer;color:var(--muted);font-weight:600}
.chip.on{background:var(--accent);color:var(--accent-contrast);border-color:transparent}
.chip.badge-khr,.badge{border-radius:999px;padding:2px 9px;font-size:.72rem;font-weight:700;background:var(--accent-soft);color:var(--accent-strong);white-space:nowrap}
.badge.new{background:rgba(22,163,74,.14);color:var(--ok)}
.badge.dup{background:rgba(217,119,6,.15);color:var(--warn)}
.badge.bad{background:rgba(220,38,38,.12);color:var(--danger)}

/* ---------- switch ---------- */
.sw{position:relative;width:44px;height:24px;flex:0 0 auto;cursor:pointer}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:var(--border);border-radius:99px;transition:.2s}
.sw i:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked + i{background:var(--accent)}
.sw input:checked + i:after{left:23px}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border)}
table.tbl{width:100%;border-collapse:collapse;font-size:.87rem;min-width:640px;background:var(--card)}
.tbl th{background:color-mix(in srgb,var(--text) 4.5%,var(--card));color:var(--muted);font-size:.76rem;text-transform:none;
  padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0}
.tbl td{padding:9px 12px;border-bottom:1px solid color-mix(in srgb,var(--border) 60%,transparent);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tfoot td{font-weight:800;background:color-mix(in srgb,var(--text) 4.5%,var(--card));border-top:2px solid var(--border)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap;color:var(--muted);font-size:.82rem}
.empty{padding:44px 16px;text-align:center;color:var(--muted)}
.empty svg{stroke:var(--muted);opacity:.55;margin-bottom:8px}

/* ---------- modal / toast ---------- */
.ovl{position:fixed;inset:0;background:rgba(10,14,26,.55);display:none;align-items:flex-start;justify-content:center;padding:5vh 14px;z-index:60;overflow:auto;backdrop-filter:blur(2px)}
.ovl.on{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);width:100%;max-width:660px;padding:20px 22px;animation:pop .18s ease}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:.6}to{transform:none;opacity:1}}
.modal h3{margin:0 0 14px;font-size:1.05rem}
.form-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--text);color:var(--bg);border-radius:11px;padding:10px 18px;font-size:.86rem;font-weight:600;box-shadow:var(--shadow);max-width:92vw;animation:pop .2s ease}
.toast.ok{background:var(--ok);color:#fff}.toast.err{background:var(--danger);color:#fff}

/* ---------- misc ---------- */
.tabs{display:flex;gap:6px;background:color-mix(in srgb,var(--text) 5%,var(--card));border:1px solid var(--border);padding:4px;border-radius:12px;width:max-content;max-width:100%;overflow:auto}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:700;font-size:.83rem;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--card);color:var(--accent-strong);box-shadow:var(--shadow)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;outline:1px solid rgba(0,0,0,.08)}
.swatch.on{border-color:var(--card);outline:3px solid var(--text)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:.9rem}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums}
.drop{border:2px dashed var(--border);border-radius:14px;padding:34px 16px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s;background:var(--card)}
.drop:hover,.drop.hot{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
.progress{height:8px;border-radius:99px;background:color-mix(in srgb,var(--text) 8%,transparent);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.qr-box{display:grid;place-items:center;padding:14px;background:#fff;border-radius:14px;border:1px solid var(--border)}
.qr-box svg{max-width:260px;height:auto}
.muted{color:var(--muted)} .small{font-size:.78rem} .center{text-align:center}
.mono{font-variant-numeric:tabular-nums}

/* ---------- mobile ---------- */
.tabbar{display:none}
@media (max-width:840px){
  .shell{display:block}
  .side{display:none}
  .main{padding:14px 12px 96px}
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);
    border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .tabbar button{flex:1;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.68rem;font-weight:700;padding:6px 2px;border-radius:10px;cursor:pointer}
  .tabbar button.on{color:var(--accent-strong);background:var(--accent-soft)}
  .stats{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{padding:12px 13px;gap:10px}
  .stat .v{font-size:1rem}
  .stat .ic{width:36px;height:36px}
  .topbar h2{font-size:1.12rem}
  .hide-sm{display:none}
}
mark{background:var(--accent-soft)}
/* ---------- print ---------- */
#printRoot{display:none}
@media print{
  body>*{display:none!important}
  body{background:#fff!important;color:#000!important}
  body>#printRoot{display:block!important}
  #printRoot{font-family:"Nokora","Khmer OS Battambang","Battambang","Noto Sans Khmer",sans-serif;color:#000}
  #printRoot table{width:100%;border-collapse:collapse;font-size:12px}
  #printRoot th,#printRoot td{border:1px solid #999;padding:5px 7px;text-align:left}
  #printRoot th{background:#eee}
  #printRoot .num{text-align:right}
}
.print-doc{max-width:800px;margin:0 auto;padding:10px 6px}
.print-doc h1{font-size:20px;text-align:center;margin:4px 0}
.print-doc .sub{text-align:center;color:#444;font-size:13px;margin-bottom:2px}
.print-doc h2{font-size:15px;margin:18px 0 6px}
.print-doc .meta{display:flex;justify-content:space-between;font-size:12px;color:#333;margin:10px 0}
.print-doc .sum{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0}
.print-doc .sum div{border:1px solid #999;border-radius:8px;padding:8px 14px;font-size:13px}
.print-doc .sign{display:flex;justify-content:space-between;margin-top:46px;font-size:13px;text-align:center;width:100%}
</style>
</head>

<script>/* ===== qr.js ===== */
/* =============================================================
 * KCD.qr — Byte-mode QR Code encoder (ISO/IEC 18004)
 * វersions 1–10, ECC L/M/Q/H, auto mask selection.
 * No external dependency. Works in browser + node (for tests).
 * ============================================================= */
(function (root, factory) {
  var mod = factory();
  if (typeof module !== 'undefined' && module.exports) module.exports = mod;
  if (root) root.KCD = root.KCD || {}, root.KCD.qr = mod;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // per version: total codewords, and per ECC level:
  //   [eccPerBlock, grp1Total, grp1Data, grp1Count, (grp2Total, grp2Data, grp2Count)?]
  var SPEC = {
    1:  { total: 26,  L: [7, 26, 19, 1], M: [10, 26, 16, 1], Q: [13, 26, 13, 1], H: [17, 26, 9, 1] },
    2:  { total: 44,  L: [10, 44, 34, 1], M: [16, 44, 28, 1], Q: [22, 44, 22, 1], H: [28, 44, 16, 1] },
    3:  { total: 70,  L: [15, 70, 55, 1], M: [26, 70, 44, 1], Q: [18, 35, 17, 2], H: [22, 35, 13, 2] },
    4:  { total: 100, L: [20, 100, 80, 1], M: [18, 50, 32, 2], Q: [26, 50, 24, 2], H: [16, 25, 9, 4] },
    5:  { total: 134, L: [26, 134, 108, 1], M: [24, 67, 43, 2], Q: [18, 33, 15, 2, 34, 16, 2], H: [22, 33, 11, 2, 34, 12, 2] },
    6:  { total: 172, L: [18, 86, 68, 2], M: [16, 43, 27, 4], Q: [24, 43, 19, 4], H: [28, 43, 15, 4] },
    7:  { total: 196, L: [20, 98, 78, 2], M: [18, 49, 31, 4], Q: [18, 32, 14, 2, 33, 15, 4], H: [26, 39, 13, 4, 40, 14, 1] },
    8:  { total: 242, L: [24, 121, 97, 2], M: [22, 60, 38, 2, 61, 39, 2], Q: [22, 40, 18, 4, 41, 19, 2], H: [26, 40, 14, 4, 41, 15, 2] },
    9:  { total: 292, L: [30, 146, 116, 2], M: [22, 58, 36, 3, 59, 37, 2], Q: [20, 36, 16, 4, 37, 17, 4], H: [24, 36, 12, 4, 37, 13, 4] },
    10: { total: 346, L: [18, 86, 68, 2, 87, 69, 2], M: [26, 69, 43, 4, 70, 44, 1], Q: [24, 43, 19, 6, 44, 20, 2], H: [28, 43, 15, 6, 44, 16, 2] }
  };
  var ALIGN = { 2: [6, 18], 3: [6, 22], 4: [6, 26], 5: [6, 30], 6: [6, 34], 7: [6, 22, 38], 8: [6, 24, 42], 9: [6, 26, 46], 10: [6, 28, 50] };
  var ECC_BITS = { L: 1, M: 0, Q: 3, H: 2 };
  var ECC_ORDER = ['L', 'M', 'Q', 'H'];

  /* ---------- GF(256) ---------- */
  var EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  (function () {
    var x = 1;
    for (var i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; }
    for (var j = 255; j < 512; j++) EXP[j] = EXP[j - 255];
  })();
  function gmul(a, b) { return (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]]; }

  function genPoly(deg) {
    var poly = [1];
    for (var i = 0; i < deg; i++) {
      var next = new Array(poly.length + 1).fill(0);
      for (var j = 0; j < poly.length; j++) {
        next[j] ^= poly[j];                      // * x
        next[j + 1] ^= gmul(poly[j], EXP[i]);     // * a^i
      }
      poly = next;
    }
    return poly;
  }
  function ecBytes(data, deg) {
    var gen = genPoly(deg), rem = gen.slice(1).map(function () { return 0; });
    for (var i = 0; i < data.length; i++) {
      var factor = data[i] ^ rem[0];
      rem.shift(); rem.push(0);
      for (var j = 0; j < rem.length; j++) rem[j] ^= gmul(gen[j + 1], factor);
    }
    return rem;
  }

    curSel.onchange = function () { refreshQuick(); refresh(); };
    amt.oninput = refresh;
    refreshQuick(); refresh();
    form.onsubmit = function (e) {
      e.preventDefault();
      var fd = new FormData(form);
      var rec = {
        id: existId || F.uid(),
        name: String(fd.get('name') || '').trim(),
        phone: String(fd.get('phone') || '').trim(),
        location: String(fd.get('location') || '').trim(),
        currency: fd.get('currency') === 'USD' ? 'USD' : 'KHR',
        amount: Math.abs(parseFloat(fd.get('amount')) || 0),
        date: fd.get('date') || F.todayISO(),
        time: fd.get('time') || F.nowHM(),
        note: String(fd.get('note') || '').trim(),
        demo: !!S.demoOn,
        updated: Date.now()
      };
      if (!rec.name) { KCD_toast('សូមបញ្ចូលឈ្មោះ', 'err'); return; }
      if (!(rec.amount > 0)) { KCD_toast('ចំនួនត្រូវតែធំជាង ០', 'err'); return; }
      var idx = existId ? S.records.findIndex(function (r) { return r.id === existId; }) : -1;
      if (idx > -1) rec.created = S.records[idx].created, S.records[idx] = rec;
      else { rec.created = Date.now(); S.records.unshift(rec); }
      closeModal();
      render();
      persist().then(function () { KCD_toast(existId ? 'បានអាប់ដេតកំណត់ហេតុ ✓' : 'បានកត់បញ្ចូល ✓', 'ok'); });
    };
  }
  root.KCD_closeModal = closeModal;

    } else {
      html += '<div class="tbl-wrap" style="border:0;border-radius:0"><table class="tbl"><thead><tr>' +
        '<th>ល.រ</th><th>កាលបរិច្ឆេទ</th><th>ឈ្មោះ</th><th>ទូរស័ព្ទ</th><th>ទីកន្លែង</th><th class="num">ចំនួន</th>' +

      pageRows.forEach(function (r, i) {

  function chip(group, val, label) {
    var on = S[group] === val;
    return '<button class="chip' + (on ? ' on' : '') + '" data-chipgroup="' + group + '" data-chipval="' + val + '">' + label + '</button>';
  }
  var sortState = { key: 'new', dir: -1 };
  function sortFn(a, b) {
    if (sortState.key === 'name') return String(a.name).localeCompare(String(b.name)) * sortState.dir;
    if (sortState.key === 'amount') return ((+a.amount || 0) - (+b.amount || 0)) * sortState.dir;
    return ((a.date || '') + (a.time || '')).localeCompare((b.date || '') + (b.time || '')) * sortState.dir;
  }
  function sortLabel() {
    var names = { new: 'ថ្មីបំផុត', amount: 'ចំនួនធំបំផុត', name: 'ឈ្មោះ ក→អ' };
    return '⇅ ' + names[sortState.key];
  }
  function highlight(text, q) {
    var t = F.esc(text || '');
    if (!q) return t;
    var lo = F.norm(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    try { return t.replace(new RegExp('(' + lo + ')', 'ig'), '<mark style="background:var(--accent-soft);color:inherit;border-radius:3px">$1</mark>'); } catch (e) { return t; }
  }

  function handleMergeFile(file) {
    if (!file) return;
    var busy = document.getElementById('mergeBusy');
    if (busy) busy.style.display = 'block';
    var ext = (file.name.split('.').pop() || '').toLowerCase();
    var finish = function (rows, err) {
      if (busy) busy.style.display = 'none';
      if (err) { KCD_toast('អានឯកសារមិនបានសម្រេច៖ ' + err, 'err'); return; }
      var res = MG.classify(rows, S.records, S.settings.rate);
      S.merge = { name: file.name, result: res };
      render();
      KCD_toast('វិភាគរួចរាល់៖ ថ្មី ' + res.stats.newCount + ' · ស្ទួន ' + res.stats.dupCount, 'ok');
    };
    if (ext === 'xls' || ext === 'xlsx') {
      var fr0 = new FileReader();
      fr0.onload = function () {
        var doParse = function () {
          try {
            var wb = root.XLSX.read(new Uint8Array(fr0.result), { type: 'array' });
            var ws = wb.Sheets[wb.SheetNames[0]];
            var rows = root.XLSX.utils.sheet_to_json(ws, { defval: '' });
            finish(MG.normalize(rows));
          } catch (e) { finish([], e.message); }
        };
        if (root.XLSX) doParse();
        else {
          var s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
          s.onload = doParse;
          s.onerror = function () { finish([], 'ត្រូវការអ៊ីនធឺណិតដើម្បីអាន .xlsx — សូមប្រើ .csv ឬ .json'); };
          document.head.appendChild(s);
        }
      };
      fr0.readAsArrayBuffer(file);
      return;
    }
    var fr = new FileReader();
    fr.onload = function () {
      try { finish(MG.fromText(file.name, String(fr.result))); } catch (e) { finish([], e.message); }
    };
    fr.onerror = function () { finish([], 'read error'); };
    fr.readAsText(file, 'utf-8');
  }

    var m = S.merge;
    if (!m) return;
    var items = m.result.items.filter(function (it) { return it.status !== 'invalid' && (which === 'all' || it.status === 'new'); });
    var now = Date.now();
    items.forEach(function (it) {
      var r = it.rec;
      S.records.push({ id: F.uid(), name: r.name, phone: r.phone, location: r.location, currency: r.currency === 'USD' ? 'USD' : 'KHR', amount: r.amount, date: r.date || F.todayISO(), time: r.time || '', note: r.note, created: now, imported: m.name, updated: now });
    });
    S.merge = null;
    render();
    persist().then(function () { KCD_toast('បានបញ្ចូល ' + items.length + ' កំណត់ហេតុ ✓', 'ok'); });

  }

  /* ================= render ================= */
  var VIEWS = { record: 'កត់ចំណងដៃ', report: 'របាយការណ៍', merge: 'បញ្ចូលទិន្នន័យរួម', settings: 'ការកំណត់' };
  var VIEW_ICONS = { record: 'record', report: 'report', merge: 'merge', settings: 'settings' };
  function render() {
    var v = S.view;
    document.querySelectorAll('[data-view]').forEach(function (b) { b.classList.toggle('on', b.dataset.view === v); });
    var today = F.longDateKh();
    var head = '<div class="topbar"><div><h2>' + VIEWS[v] + '</h2><div class="sub">' + today + '</div></div>' +
      '<div class="row" style="gap:8px">' +
      (v === 'report' || v === 'record' ? '<button class="btn icon" data-act="toggleTheme" title="ពន្លឺ/ងងឹត">' + (S.settings.theme === 'dark' ? ICON.sun : ICON.moon) + '</button>' : '') +
      (v === 'record' ? '<button class="btn pri" data-act="add">' + ICON.plus + '<span class="hide-sm">បន្ថែមភ្ញៀវ</span></button>' : '') +
      '</div></div>';
    var body = v === 'record' ? viewRecord() : v === 'report' ? viewReport() : v === 'merge' ? viewMerge() : viewSettings();
    document.getElementById('view').innerHTML = head + body;
    bindView(v);
  }

  function bindView(v) {
    if (v === 'record') {
      var qEl = document.getElementById('q');
      if (qEl) {
        qEl.oninput = debounce(function () { S.q = qEl.value; S.page = 1; render(); var e = document.getElementById('q'); e.focus(); e.setSelectionRange(e.value.length, e.value.length); }, 260);
      }
      var locSel = document.getElementById('locSel');
      if (locSel) locSel.onchange = function () { S.locFilter = locSel.value; S.page = 1; render(); };
      document.querySelectorAll('[data-edit]').forEach(function (b) { b.onclick = function () { openEdit(b.dataset.edit); }; });
      document.querySelectorAll('[data-del]').forEach(function (b) { b.onclick = function () { delRecord(b.dataset.del); }; });
      document.querySelectorAll('[data-page]').forEach(function (b) { b.onclick = function () { if (!b.disabled) { S.page = +b.dataset.page; render(); window.scrollTo(0, 0); } }; });
      var sortBtn = document.querySelector('[data-act="sort"]');
      if (sortBtn) sortBtn.onclick = function () {
        var order = ['new', 'amount', 'name'];
        sortState.key = order[(order.indexOf(sortState.key) + 1) % 3];
        render();
      };
    }
    if (v === 'report') {
      var rl = document.getElementById('rLoc'); if (rl) rl.onchange = function () { S.locFilter = rl.value; render(); };
      var rm = document.getElementById('rMonth'); if (rm) rm.onchange = function () { S.monthFilter = rm.value; render(); };
    }
    if (v === 'merge') {
      var f = document.getElementById('mergeFile');
      if (f) f.onchange = function () { handleMergeFile(f.files[0]); f.value = ''; };
      var dz = document.getElementById('dropZone');
      if (dz) {
        ['dragover', 'dragenter'].forEach(function (ev) { dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.add('hot'); }); });
        ['dragleave', 'drop'].forEach(function (ev) { dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.remove('hot'); }); });
        dz.addEventListener('drop', function (e) { if (e.dataTransfer.files[0]) handleMergeFile(e.dataTransfer.files[0]); });
      }
    }
    if (v === 'settings') {
      var pick = document.getElementById('accentPick');
      if (pick) pick.oninput = function () { S.settings.accent = pick.value; saveSettings(); render(); };
      ['pdfTitle', 'pdfOrg', 'pdfFooter'].forEach(function (k) {
        var el = document.querySelector('[data-f="' + k + '"]');
        if (el) el.onchange = function () { S.settings[k] = el.value; saveSettings(); };
      });
      document.querySelectorAll('[data-f="paper"],[data-f="orientation"],[data-f="pdfEngine"]').forEach(function (el) {
        el.onchange = function () { S.settings[el.dataset.f] = el.value; saveSettings(); };
      });
      var rateEl = document.getElementById('rate');
      if (rateEl) rateEl.onchange = function () { var v2 = parseFloat(rateEl.value); if (v2 > 0) { S.settings.rate = v2; saveSettings(); KCD_toast('អត្រា៖ 1$ = ' + F.nf(v2) + ' រៀល', 'ok'); } };
      var lf = document.getElementById('logoFile');
      if (lf) lf.onchange = function () { handleLogo(lf.files[0]); };
      var ib = document.getElementById('installBtn');
      if (ib) ib.onclick = function () { if (S.deferredPrompt) { S.deferredPrompt.prompt(); S.deferredPrompt = null; } };
      var imb = document.getElementById('importBackup');
      if (imb) imb.onchange = function () { importBackup(imb.files[0]); imb.value = ''; };
      estimateSize();
      genQR(true);
    }
  }
  function debounce(fn, ms) { var t; return function () { clearTimeout(t); t = setTimeout(fn, ms); }; }

  function openEdit(id) {
    var r = S.records.find(function (x) { return x.id === id; });
    if (!r) return;
    openModal('<h3>កែកំណត់ហេតុ</h3>' + recordForm(r), { after: function () { bindRecordForm(id); formFocus(); } });
  }
  function formFocus() { var e = document.querySelector('#recForm [name=name]'); if (e) setTimeout(function () { e.focus(); }, 50); }
  function delRecord(id) {
    var r = S.records.find(function (x) { return x.id === id; });
    if (!r) return;
    confirmBox('លុបកំណត់ហេតុ', 'តើលោកអ្នកប្រាកដទេ? នឹងលុប «' + r.name + ' — ' + (r.currency === 'USD' ? '$' + r.amount : r.amount + ' រៀល') + '» ចេញ។', 'លុប', true).then(function (yes) {
      if (!yes) return;
      S.records = S.records.filter(function (x) { return x.id !== id; });
      DB.removeMany([id]);
      render();
      persist().then(function () { KCD_toast('បានលុប ✓', 'ok'); });
    });
  }

  /* settings misc */
  function handleLogo(file) {
    if (!file) return;
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var max = 420, sc = Math.min(1, max / Math.max(img.width, img.height));
        var cv = document.createElement('canvas');
        cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        S.settings.logo = cv.toDataURL('image/png');
        saveSettings(); render(); KCD_toast('បានរក្សាទុក logo ✓', 'ok');
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  }
  function estimateSize() {
    var el = document.getElementById('dbSize');
    if (!el) return;
    var approx = JSON.stringify(S.records).length;
    el.textContent = F.nf(Math.round(approx / 1024)) + ' KB';
    if (navigator.storage && navigator.storage.estimate) {
      navigator.storage.estimate().then(function (e) { if (e.usage) el.textContent += ' (device ' + F.nf(Math.round(e.usage / 1048576 * 10) / 10) + ' MB)'; }).catch(function () {});
    }
  }
  function importBackup(file) {
    if (!file) return;
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var parsed = EX.parseBackup(String(fr.result));
        var n = parsed.records.length;
        confirmBox('Import Backup', 'នឹងជំនួសទិន្នន័យបច្ចុប្បន្ន (' + F.nf(S.records.length) + ') ដោយឯកសារនេះ (' + F.nf(n) + ' កំណត់ហេតុ)' + (parsed.settings ? ' រួមទាំងការកំណត់។' : '។'), 'ជំនួស', true).then(function (yes) {
          if (!yes) return;
          S.records = parsed.records.map(function (r) { r.id = r.id || F.uid(); return r; });
          if (parsed.settings) for (var k in parsed.settings) if (k in DEF_SETTINGS) S.settings[k] = parsed.settings[k];
          saveSettings();
          render();
          persist().then(function () { KCD_toast('Import រួចរាល់ ✓', 'ok'); });
        });
      } catch (e) { KCD_toast('ឯកសារមិនមែនជា backup ត្រឹមត្រូវ', 'err'); }
    };
    fr.readAsText(file, 'utf-8');
  }
  function reportPrintOpts(needWin) {
    var d = reportData();
    var s = S.settings;
    var chartsSvg = s.showCharts && d.sum.rows.length ?
      '<div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center">' + CH.donut(d.sum.rows.map(function (x) { return { label: x.loc, value: x.count }; }), { size: 150 }) + CH.bars(d.sum.rows.map(function (x) { return { label: x.loc, value: x.khr, disp: F.nf(Math.round(x.khr)) + ' ៛' }; }), { width: 360 }) + '</div>' : '';
    var filterStr = (S.locFilter ? 'ទីកន្លែង៖ ' + S.locFilter : '') + (S.monthFilter ? (S.locFilter ? ' · ' : '') + 'ខែ៖ ' + monthLabel(S.monthFilter) : '');
    return {
      title: s.pdfTitle, org: s.pdfOrg, footer: s.pdfFooter, dateStr: s.showDate ? F.longDateKh() : '', filterStr: filterStr,
      sum: d.sum, recs: d.list, rate: s.rate, showSign: s.showSign, showLogo: !!s.logo, logo: s.logo, chartsSvg: chartsSvg,
      settings: s, filename: 'donation-' + F.todayISO() + '.pdf'
    };
  }

  /* ================= actions ================= */
  function action(a, el) {
    var s = S.settings;
    if (a === 'add') openModal('<h3>បន្ថែមភ្ញៀវ — កត់ចំណងដៃ</h3>' + recordForm(), { after: function () { bindRecordForm(null); formFocus(); } });
    else if (a === 'toggleTheme') { s.theme = s.theme === 'dark' ? 'light' : 'dark'; saveSettings(); render(); }
    else if (a === 'clearfilters') { S.locFilter = ''; S.monthFilter = ''; S.q = ''; S.dayFilter = 'all'; render(); }
    else if (a === 'exportExcel') {
      var d = reportData();
      EX.download('ចំណងដៃ-' + F.todayISO() + '.xls', EX.xlsText(d.list, { rate: s.rate }), 'application/vnd.ms-excel');
      KCD_toast('បាន Export Excel ✓', 'ok');
    }
    else if (a === 'exportCsvFile' || a === 'exportCsv') {
      EX.download('ចំណងដៃ-' + F.todayISO() + '.csv', EX.csvText(S.records, { rate: s.rate }), 'text/csv');
      KCD_toast('បាន Export CSV ✓', 'ok');
    }
    else if (a === 'exportPDF') {
      KCD_toast('កំពុងត្រៀម PDF… (ជ្រើសរើស «Save as PDF» ក្នុងប្រអប់បោះពុម្ព)', 'ok');
      EX.exportPDF(reportPrintOpts(), s);
    }
    else if (a === 'print') { EX.print(reportPrintOpts()); }
    else if (a === 'copySummary') {
      var d2 = reportData();
      var lines = ['របាយការណ៍ប្រមូលចំណងដៃ (' + F.longDateKh() + ')',
        'ភ្ញៀវសរុប៖ ' + F.nf(d2.sum.count) + ' នាក់', 'រៀលសរុប៖ ' + F.nf(Math.round(d2.sum.khr)), 'ដុល្លារសរុប៖ $' + F.nf(d2.sum.usd, 2),
        '', ...d2.sum.rows.map(function (x) { return x.loc + ': ' + x.count + ' នាក់ · ' + F.nf(Math.round(x.khr)) + ' រៀល'; })];
      copyText(lines.join('\n'));
    }
    else if (a === 'backup') { EX.download('kcd-backup-' + F.todayISO() + '.json', EX.backupJSON(S.records, S.settings), 'application/json'); KCD_toast('បាន Export Backup ✓', 'ok'); }
    else if (a === 'demo') loadDemo();
    else if (a === 'wipe') {
      promptDanger('លុបទិន្នន័យទាំងអស់', '<div>នឹងលុបកំណត់ហេតុ <b>' + F.nf(S.records.length) + '</b> ទាំងអស់ចេញពី database។ សូមធ្វើ Export Backup មុនពេលលុប!</div>').then(function (yes) {
        if (!yes) return;
        S.records = []; localStorage.removeItem(DEMO_FLAG);
        DB.clear().then(function () {
          try { localStorage.setItem(LS_KEY_FALLBACK, '[]'); } catch (e) {}
          S.cleared = Date.now();
          render(); KCD_toast('បានលុបទិន្នន័យទាំងអស់', 'ok');
        });
      });
    }
    else if (a === 'wipeSettings') {
      confirmBox('កំណត់ឡើងវិញ', 'ការកំណត់រូបរាង/PDF/QR នឹងត្រឡប់ទៅលំនាំដើម (ទិន្នន័យមិនបាត់)។', 'កំណត់ឡើងវិញ', false).then(function (yes) {
        if (!yes) return;
        S.settings = defaults(); localStorage.removeItem(SKEY); saveSettings(); render(); KCD_toast('បានកំណត់ឡើងវិញ ✓', 'ok');
      });
    }
    else if (a === 'importnew') doImport('new');
    else if (a === 'importall') doImport('all');
    else if (a === 'mergecancel') { S.merge = null; render(); }
    else if (a === 'genqr') genQR();
    else if (a === 'qrsvg') { if (!qrCache) genQR(); if (!qrCache) return; EX.download('qrcode.svg', QR.toSVG(qrCache, { pixelSize: 10 }), 'image/svg+xml'); }
    else if (a === 'qrpng') {
      if (!qrCache) { genQR(); }
      if (!qrCache) return;
      var px = 10, dim = (qrCache.size + 8) * px;
      var cv = document.createElement('canvas'); cv.width = dim; cv.height = dim;
      var cx2 = cv.getContext('2d');
      cx2.fillStyle = '#fff'; cx2.fillRect(0, 0, dim, dim); cx2.fillStyle = '#000';
      for (var r = 0; r < qrCache.size; r++) for (var c = 0; c < qrCache.size; c++) if (qrCache.modules[r][c]) cx2.fillRect((c + 4) * px, (r + 4) * px, px, px);
      cv.toBlob(function (b) { var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'qrcode.png'; a.click(); });
    }
  }
  function copyText(t) {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { KCD_toast('បានចម្លងរួចរាល់ ✓', 'ok'); }, function () { fallbackCopy(t); });
    else fallbackCopy(t);
  }
  function fallbackCopy(t) {
    var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); KCD_toast('បានចម្លងរួចរាល់ ✓', 'ok'); } catch (e) { KCD_toast('ចម្លងមិនបាន', 'err'); }
    ta.remove();
  }

  /* ================= boot ================= */
  function bindShell() {
    document.querySelectorAll('[data-view]').forEach(function (b) {
      b.addEventListener('click', function () { S.view = b.dataset.view; S.page = 1; render(); window.scrollTo(0, 0); });
    });
    document.body.addEventListener('click', function (e) {
      var act = e.target.closest('[data-act]');
      if (act) { e.preventDefault(); action(act.dataset.act, act); return; }
      var st = e.target.closest('[data-set]');
      if (st) { S.settings[st.dataset.set] = st.dataset.val === '' ? '' : st.dataset.val; saveSettings(); render(); return; }
      var tg = e.target.closest('[data-toggle]');
      if (tg) { var k = tg.dataset.toggle; S.settings[k] = !S.settings[k]; saveSettings(); render(); return; }
      var cg = e.target.closest('[data-chipgroup]');
      if (cg) { var g = cg.dataset.chipgroup, val = cg.dataset.chipval; S[g] = S[g] === val && g !== 'dayFilter' ? '' : val; if (g === 'dayFilter') S.dayFilter = val; S.page = 1; render(); return; }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeModal();
      if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { var q2 = document.getElementById('q'); if (q2) { q2.focus(); e.preventDefault(); } }
    });
  }
  function boot() {
    modalHost = document.getElementById('modalHost');
    document.querySelectorAll('[data-icon]').forEach(function (el) { el.innerHTML = ICON[el.dataset.icon] || ''; });
    loadSettings();
    DB.init().then(function () { return DB.loadAll(); }).then(function (rows) {
      S.records = rows.filter(function (r) { return r && (r.name || r.amount); });
      bindShell();
      render();
    });
    if (root.deferredPromptGlobal) S.deferredPrompt = root.deferredPromptGlobal;
    if (location.protocol.startsWith('http') && 'serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  }
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    S.deferredPrompt = e;
    if (S.view === 'settings') render();
  });
  root.KCD_app = { boot: boot, state: S, render: render, action: action, toast: KCD_toast };
  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  }
})(typeof self !== 'undefined' ? self : this);
</script>
</body>
</html>
